name: Actualizar Resultados de Animalitos

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias y Playwright
      run: |
        python -m pip install --upgrade pip
        pip install playwright beautifulsoup4
        playwright install chromium

    - name: Ejecutar Extractor con Navegador Real
      run: python scraper.py

    - name: Guardar y Publicar Resultados e Historial
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add resultados.json historial_resultados.json
        git diff-index --quiet HEAD || git commit -m "Actualización automática de resultados e historial"
        git push
