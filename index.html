<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loterías y Animalitos en Vivo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <span class="live-indicator"></span>
            <h1>ANIMALITOSVE</h1>
        </div>
        <p>Resultados en tiempo real</p>
    </header>

    <main class="container">
        <!-- Filtros horizontales deslizantes -->
        <div id="contenedor-filtros" class="filtros-container">
            <button class="btn-filtro active" onclick="filtrarPorLoteria('Todas', window.todosLosDatos || [], this)">🔥 Todas</button>
        </div>

        <!-- Cuadrícula de tarjetas de 2 columnas -->
        <div id="contenedor-resultados" class="grid-resultados">
            <p style="text-align: center; color: #8b949e; grid-column: 1 / -1; padding: 20px;">Cargando resultados...</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
