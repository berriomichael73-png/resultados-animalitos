<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animalitos VE - En Vivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <h1>🟢 ANIMALITOS VE</h1>
        <p>Resultados en tiempo real</p>
    </header>

    <main class="container">
        <!-- Filtros de loterías -->
        <div id="contenedor-filtros" class="filtros-container">
            <button class="btn-filtro active" onclick="filtrarPorLoteria('Todas', window.todosLosDatos || [], this)">🔥 Todas</button>
        </div>

        <!-- Cuadrícula de tarjetas -->
        <div id="contenedor-resultados" class="grid-resultados">
            <p style="text-align: center; color: #aaa; grid-column: 1 / -1;">Conectando con el servidor en vivo...</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
